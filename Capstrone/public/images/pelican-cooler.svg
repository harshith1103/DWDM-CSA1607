<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="trimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="latchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="iceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" fill="url(#bgGrad)"/>
  
  <!-- Subtle Ice Glow -->
  <circle cx="300" cy="240" r="180" fill="#06b6d4" opacity="0.08" filter="blur(30px)"/>

  <!-- Drop Shadow Base -->
  <ellipse cx="300" cy="380" rx="200" ry="25" fill="#000" opacity="0.5"/>

  <!-- Ice Cubes Accent in Foreground -->
  <g transform="translate(100, 340)">
    <rect x="0" y="0" width="30" height="30" rx="6" fill="url(#iceGrad)" stroke="#7dd3fc" stroke-width="1.5" transform="rotate(15)"/>
    <rect x="360" y="-10" width="35" height="35" rx="8" fill="url(#iceGrad)" stroke="#7dd3fc" stroke-width="1.5" transform="rotate(-20)"/>
    <rect x="385" y="15" width="24" height="24" rx="5" fill="url(#iceGrad)" stroke="#7dd3fc" stroke-width="1.5" transform="rotate(10)"/>
  </g>

  <!-- Main Cooler Container -->
  <g filter="url(#shadow)">
    <!-- Side Heavy Handles (Left & Right) -->
    <rect x="85" y="210" width="30" height="50" rx="8" fill="url(#trimGrad)" stroke="#475569" stroke-width="2"/>
    <rect x="95" y="225" width="10" height="20" rx="4" fill="#0f172a"/>
    
    <rect x="485" y="210" width="30" height="50" rx="8" fill="url(#trimGrad)" stroke="#475569" stroke-width="2"/>
    <rect x="495" y="225" width="10" height="20" rx="4" fill="#0f172a"/>

    <!-- Main Cooler Body -->
    <rect x="110" y="160" width="380" height="190" rx="24" fill="url(#bodyGrad)" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Bottom Reinforced Corners / Skid Feet -->
    <path d="M125 350 L160 350 L160 362 L135 362 C129.477 362 125 357.523 125 352 Z" fill="url(#trimGrad)"/>
    <path d="M475 350 L440 350 L440 362 L465 362 C470.523 362 475 357.523 475 352 Z" fill="url(#trimGrad)"/>

    <!-- Cooler Lid Top Section -->
    <rect x="104" y="125" width="392" height="48" rx="14" fill="url(#lidGrad)" stroke="#94a3b8" stroke-width="2"/>
    <rect x="114" y="132" width="372" height="10" rx="5" fill="url(#trimGrad)" opacity="0.15"/>

    <!-- Lid Rubber Gasket / Seal Line -->
    <line x1="110" y1="172" x2="490" y2="172" stroke="#334155" stroke-width="3"/>

    <!-- Center Pelican Logo Plate -->
    <rect x="220" y="190" width="160" height="42" rx="6" fill="url(#trimGrad)" stroke="#64748b" stroke-width="1.5"/>
    <text x="300" y="210" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="16" letter-spacing="2">PELICAN</text>
    <text x="300" y="224" text-anchor="middle" fill="#06b6d4" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="9" letter-spacing="1">ELITE 30-QUART COOLER</text>

    <!-- Heavy Duty Press & Pull Latches (2 Front Latches) -->
    <!-- Latch 1 (Left) -->
    <rect x="165" y="155" width="36" height="65" rx="6" fill="url(#trimGrad)" stroke="#1e293b" stroke-width="2"/>
    <rect x="171" y="175" width="24" height="35" rx="4" fill="url(#latchGrad)"/>
    <circle cx="183" cy="192" r="5" fill="#ffffff" opacity="0.9"/>
    
    <!-- Latch 2 (Right) -->
    <rect x="399" y="155" width="36" height="65" rx="6" fill="url(#trimGrad)" stroke="#1e293b" stroke-width="2"/>
    <rect x="405" y="175" width="24" height="35" rx="4" fill="url(#latchGrad)"/>
    <circle cx="417" cy="192" r="5" fill="#ffffff" opacity="0.9"/>

    <!-- Tie-Down Slots & Drain Plug Accent -->
    <rect x="135" y="295" width="20" height="25" rx="4" fill="url(#trimGrad)"/>
    <circle cx="455" cy="305" r="10" fill="url(#trimGrad)" stroke="#64748b" stroke-width="2"/>
    <circle cx="455" cy="305" r="5" fill="#0f172a"/>
  </g>

  <!-- Cold Frost Vapor Effect -->
  <path d="M140 120 Q160 90 190 115 T240 100" fill="none" stroke="#e0f2fe" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
  <path d="M350 110 Q380 85 410 105 T460 95" fill="none" stroke="#e0f2fe" stroke-width="2" opacity="0.4" stroke-linecap="round"/>

  <!-- Badge Label Overlay -->
  <g transform="translate(420, 50)">
    <rect width="140" height="32" rx="16" fill="rgba(6, 182, 212, 0.2)" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="70" y="21" text-anchor="middle" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12">❄️ ICE RETENTION</text>
  </g>
</svg>
