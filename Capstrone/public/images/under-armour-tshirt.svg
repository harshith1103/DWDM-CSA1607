<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="sleeveShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="shadowT" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" fill="url(#bgGradT)"/>

  <!-- Radial Glow behind T-Shirt -->
  <circle cx="300" cy="225" r="160" fill="#38bdf8" opacity="0.1" filter="blur(25px)"/>

  <!-- T-Shirt Shadow Base -->
  <ellipse cx="300" cy="400" rx="140" ry="18" fill="#000" opacity="0.4"/>

  <!-- T-Shirt Group -->
  <g filter="url(#shadowT)">
    <!-- Main Athletic T-Shirt Outline -->
    <!-- Left Sleeve -->
    <path d="M 170 120 L 100 185 L 145 240 L 195 195 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M 100 185 L 145 240 L 152 232 L 110 180 Z" fill="url(#sleeveShadow)"/>

    <!-- Right Sleeve -->
    <path d="M 430 120 L 500 185 L 455 240 L 405 195 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M 500 185 L 455 240 L 448 232 L 490 180 Z" fill="url(#sleeveShadow)"/>

    <!-- Main Torso Body -->
    <path d="M 170 120 C 220 145, 380 145, 430 120 L 405 195 L 415 375 C 415 385, 395 390, 300 390 C 205 390, 185 385, 185 375 L 195 195 Z" fill="url(#shirtGrad)" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Crew Neck Collar -->
    <path d="M 235 120 C 260 150, 340 150, 365 120 C 340 132, 260 132, 235 120 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <path d="M 245 120 C 265 138, 335 138, 355 120" fill="none" stroke="#64748b" stroke-width="1.5"/>

    <!-- Athletic Seam Lines & Mesh Pattern (Tech 2.0 Feature) -->
    <path d="M 195 195 C 230 220, 230 320, 210 385" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.7"/>
    <path d="M 405 195 C 370 220, 370 320, 390 385" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.7"/>

    <!-- Under Armour Style Chest Logo -->
    <g transform="translate(300, 180) scale(1.1)">
      <!-- Interlocking UA Logo Geometry -->
      <path d="M -15 -18 C -5 -30, 5 -30, 15 -18 C 10 -10, -10 -10, -15 -18 Z" fill="#ffffff"/>
      <path d="M -15 2 C -5 14, 5 14, 15 2 C 10 -6, -10 -6, -15 2 Z" fill="#ffffff"/>
      <rect x="-3" y="-18" width="6" height="20" fill="#ffffff" rx="2"/>
    </g>

    <!-- UA Tech Tag Highlight -->
    <text x="300" y="215" text-anchor="middle" fill="#93c5fd" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="11" letter-spacing="2">UA TECH 2.0</text>
  </g>

  <!-- Performance Badge Overlay -->
  <g transform="translate(420, 40)">
    <rect width="140" height="32" rx="16" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="70" y="21" text-anchor="middle" fill="#7dd3fc" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11">⚡ QUICK DRY</text>
  </g>
</svg>
